name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Test (Release)
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Headless smoke test
        run: |
          dotnet run --project src/Simulation.Headless -c Release --no-build -- \
            --seed 123456 --duration-days 30

      - name: Determinism smoke check
        run: |
          dotnet run --project src/Simulation.Headless -c Release --no-build -- \
            --seed 123456 --duration-days 30 --verify-determinism

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # Optional, lightweight benchmark smoke test: verifies the benchmark
  # project builds and that benchmarks are discoverable, without running
  # a full BenchmarkDotNet suite on every commit (see
  # docs/PERFORMANCE_BUDGET.md — benchmarks are not gated in CI).
  benchmarks-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build benchmarks project
        run: dotnet build src/Simulation.Benchmarks -c Release
